# Konfiguration des eToro-Trading-Bots
#
# mode:
#   paper – simuliertes Geld, echte Marktpreise (Standard, kein eToro-Konto nötig)
#   demo  – eToro-Demokonto über die API (virtuelles Geld bei eToro)
#   live  – ECHTES GELD. Zusätzlich muss ETORO_ALLOW_LIVE=yes gesetzt sein.
mode: paper

# Startkapital für den Papier-Modus (USD)
paper_start_balance: 10000

# Grobe Schätzung der Übernachtgebühren für Hebel-/Short-Positionen (% des Marktwerts pro Jahr),
# nur für den Backtest. Die echten eToro-Gebühren variieren je Instrument.
backtest_overnight_fee_pct_per_year: 6.0

risk:
  risk_per_trade_pct: 1.0      # max. Verlust pro Trade bis zum Stop-Loss, in % des Kapitals
  max_position_pct: 15.0       # max. Einsatz (Margin) pro Position in % des Kapitals
  max_exposure_pct: 30.0       # max. Marktwert (Einsatz x Hebel) pro Position in % des Kapitals
  max_total_exposure_pct: 150.0  # max. Marktwert aller Positionen zusammen in % des Kapitals
  max_open_positions: 8
  max_daily_loss_pct: 3.0      # Tagesverlust-Stopp: keine neuen Trades mehr an diesem Tag
  min_order_usd: 50            # Mindesteinsatz pro Trade
  leverage: 2                  # Standard-Hebel; pro Instrument überschreibbar (eToro erlaubt
                               # Indizes bis 20, Rohstoffe bis 10, Aktien bis 5)
  allow_short: true            # auch auf fallende Kurse setzen

strategy:
  fast_sma: 20
  slow_sma: 50
  trend_sma: 200
  rsi_period: 14
  rsi_max_entry: 70            # nicht kaufen, wenn überkauft
  rsi_min_short: 30            # nicht shorten, wenn überverkauft
  atr_period: 14
  stop_atr_mult: 2.0           # Stop-Loss = Einstieg - 2 x ATR
  take_profit_atr_mult: 4.0    # Take-Profit = Einstieg + 4 x ATR

# Watchlist: Indizes, Rohstoffe, Unternehmen.
#   symbol:      eToro-Suchbegriff / Ticker
#   yahoo:       Ticker für historische Kursdaten (Yahoo Finance)
#   instrument_id: eToro-ID (leer lassen -> wird per API-Suche ermittelt)
#   min_usd:     eToro-Mindestbetrag pro Position (Indizes/Rohstoffe: 1000 USD)
watchlist:
  # Indizes
  - {symbol: SPX500, yahoo: "^GSPC", instrument_id: 27, min_usd: 1000}
  - {symbol: NSDQ100, yahoo: "^NDX", instrument_id: 28, min_usd: 1000}
  - {symbol: GER40, yahoo: "^GDAXI", instrument_id: 32, min_usd: 1000}
  # Rohstoffe
  - {symbol: GOLD, yahoo: "GC=F", instrument_id: 18, min_usd: 1000}
  - {symbol: OIL, yahoo: "CL=F", instrument_id: 17, min_usd: 1000}
  - {symbol: SILVER, yahoo: "SI=F", instrument_id: 19, min_usd: 1000}
  # Unternehmen
  - {symbol: AAPL, yahoo: "AAPL", instrument_id: 1001, min_usd: 10}
  - {symbol: MSFT, yahoo: "MSFT", instrument_id: 1004, min_usd: 10}
  - {symbol: NVDA, yahoo: "NVDA", instrument_id: 1137, min_usd: 10}
  - {symbol: AMZN, yahoo: "AMZN", instrument_id: 1005, min_usd: 10}
