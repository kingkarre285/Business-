name: Product Sniper

on:
  schedule:
    - cron: "0 6,18 * * *"   # 06:00 und 18:00 UTC
  workflow_dispatch:
    inputs:
      min_score:
        description: "Alarmschwelle (0-100)"
        required: false
        default: "70"
      region:
        description: "Marktregion (DE, US, GB, ...)"
        required: false
        default: "DE"

permissions:
  contents: write   # Verlauf (data/state.json) zurueckschreiben
  pages: write      # Report auf GitHub Pages veroeffentlichen
  id-token: write

concurrency:
  group: sniper
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Optionale Abhaengigkeiten
        run: pip install --quiet openpyxl

      - name: Config vorbereiten
        env:
          KALODATA_API_KEY: ${{ secrets.KALODATA_API_KEY }}
          REGION: ${{ github.event.inputs.region || 'DE' }}
        run: |
          test -f config.json || cp config.example.json config.json
          python - <<'PY'
          import json, os
          cfg = json.load(open("config.json"))
          # Im CI alarmiert Telegram; die Konsole landet ohnehin im Lauf-Log
          for n in cfg["notifiers"]:
              n["enabled"] = n["type"] in ("console", "telegram")
          if os.environ.get("KALODATA_API_KEY"):
              cfg["source"]["type"] = "api"
          cfg["source"]["api"]["request"]["region"] = os.environ["REGION"]
          json.dump(cfg, open("config.json", "w"), indent=2, ensure_ascii=False)
          PY

      - name: Datenquelle pruefen
        id: source
        env:
          KALODATA_API_KEY: ${{ secrets.KALODATA_API_KEY }}
        run: |
          # Ohne API-Key und ohne abgelegten Export gibt es nichts zu tun.
          # Lieber sauber ueberspringen als zweimal taeglich rot laufen.
          if [ -n "$KALODATA_API_KEY" ] || ls data/*.csv data/*.xlsx >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Keine Datenquelle: weder KALODATA_API_KEY gesetzt noch ein Export unter data/. Lauf uebersprungen."
          fi

      - name: Sniper laufen lassen
        if: steps.source.outputs.ready == 'true'
        env:
          KALODATA_API_KEY: ${{ secrets.KALODATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Diese Adresse steht in jedem Telegram-Push - der Push zeigt die
          # Spitze, die Seite den ganzen Lauf
          SNIPER_REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python -m kalodata_sniper run \
            --min-score "${{ github.event.inputs.min_score || '70' }}"

      - name: Seite vorbereiten
        if: steps.source.outputs.ready == 'true'
        run: |
          mkdir -p _site
          cp reports/latest.html _site/index.html
          cp reports/*.csv _site/ 2>/dev/null || true

      - uses: actions/configure-pages@v5
        if: steps.source.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.ready == 'true'
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        if: steps.source.outputs.ready == 'true'

      - name: Reports als Artefakt sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sniper-reports
          path: reports/
          retention-days: 30

      - name: Verlauf zurueckschreiben
        run: |
          if [ -n "$(git status --porcelain data/state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: Sniper-Verlauf aktualisiert"
            git push
          fi
